name: check

on:
  push:
    branches: main
  pull_request:
    branches: "*"

jobs:
  # Phase 1: Build libOpenDRIVE WASM (cached by submodule commit)
  build-wasm:
    name: build-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Get submodule commit hash (cache key)
        id: submodule-hash
        run: echo "hash=$(git -C submodule/libOpenDRIVE rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache WASM artifacts
        id: cache-wasm
        uses: actions/cache@v6
        with:
          path: src/wasm/libOpenDRIVE.js
          key: wasm-${{ runner.os }}-${{ steps.submodule-hash.outputs.hash }}-${{ hashFiles('CMakeLists.txt', 'submodule/libOpenDRIVE/src/Embind.cpp') }}

      - name: Setup Emscripten
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: latest

      - name: Build WASM module
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: npm run build:wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-artifacts
          path: src/wasm/libOpenDRIVE.js
          retention-days: 7

  # Phase 2: TypeScript lint, test, build (depends on WASM)
  check:
    name: check (${{ matrix.os }})
    needs: build-wasm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-artifacts
          path: src/wasm/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Install Dependencies
        run: npm ci

      - name: Verify WASM artifacts
        run: npm run build:wasm:check

      - name: Type Check
        run: npm run typecheck

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: Test Project
        run: npm test

      - name: Check linting
        run: npm run lint:ci

      - name: Build Project
        run: npm run build
